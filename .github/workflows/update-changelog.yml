name: 📝 Auto Update Changelog (PR)

on:
  push:
    branches: [main, master]
    paths:
      - 'scripts/**/*.sh'
      - 'docs/**/*.md'
      - 'scripts/**/readme.md'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get changed files
        id: changed
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
          else
            CHANGED=""
          fi
          echo "changed<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "📋 Changed files:"
          echo "$CHANGED" | head -20

      - name: Update CHANGELOG
        run: |
          bash .github/scripts/update-changelog.sh "${{ steps.changed.outputs.changed }}"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        if: ${{ !github.event.pull_request }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "📝 docs: автообновление CHANGELOG [skip ci]"
          committer: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          branch: "changelog/auto-update-${{ github.run_id }}"
          delete-branch: true
          title: "📝 docs: автоматическое обновление CHANGELOG.md"
          body: |
            ## 🔄 Автообновление CHANGELOG.md
            
            Этот PR создан автоматически при изменении скриптов или документации.
            
            ### 📋 Изменения:
            - ✅ Новые скрипты добавлены в секцию `[Добавлено]`
            - ✏️ Изменённые скрипты добавлены в секцию `[Изменено]`
            - 🏗️ Заголовки секций созданы автоматически при необходимости
            
            ### 🧪 Проверка:
            - [ ] Записи в таблице корректно отформатированы
            - [ ] Ссылки на документацию работают
            - [ ] Описания скриптов читаемы
            
            > ⚠️ Не редактируйте этот PR вручную — следующие изменения создадут новый.
            
            ---
            *Сгенерировано автоматически • [workflow](.github/workflows/update-changelog.yml)*
          labels: |
            documentation
            automated-pr
            changelog
          assignees: ${{ github.actor }}
          reviewers: ${{ github.actor }}
          draft: false